# A production-shaped PREVIEW on one machine: real Postgres, the API and the worker from the same image that is deployed.
#   docker compose -f docker-compose.preview.yml up --build        then:  npm run build && npm run preview   (frontend on :4173)
# Development login is enabled here ON PURPOSE so you can click through without a Supabase project; the deployed API uses Supabase.
# Throwaway credentials, loopback ports only. Never use this file for anything reachable from the internet.
services:
  db:
    image: postgres:17
    environment: { POSTGRES_USER: tinker, POSTGRES_PASSWORD: tinker, POSTGRES_DB: tinker }
    ports: ["127.0.0.1:54330:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U tinker -d tinker"], interval: 3s, timeout: 3s, retries: 20 }

  migrate:
    build: .
    command: ["npm", "run", "db:migrate", "-w", "@tinker/server"]
    environment: { DATABASE_URL: "postgres://tinker:tinker@db:5432/tinker" }
    depends_on: { db: { condition: service_healthy } }

  api:
    build: .
    environment:
      NODE_ENV: development
      AUTH_MODE: dev
      HOST: 0.0.0.0
      PORT: "8787"
      DATABASE_URL: "postgres://tinker:tinker@db:5432/tinker"
      CORS_ORIGINS: "http://localhost:4173,http://localhost:5173"
    ports: ["127.0.0.1:8788:8787"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:
    build: .
    command: ["npx", "tsx", "server/src/worker.ts"]
    environment: { NODE_ENV: development, DATABASE_URL: "postgres://tinker:tinker@db:5432/tinker" }
    depends_on: { migrate: { condition: service_completed_successfully } }
