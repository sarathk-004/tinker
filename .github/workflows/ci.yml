name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck (frontend, shared, server)
        run: npm run typecheck
      - name: Unit and API tests
        run: npm test
      - name: Contract boundaries
        run: npm run check:boundaries
      - name: Build frontend
        run: npm run build
